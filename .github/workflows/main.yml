name: Build Android Kernel

on:
  push:
    branches:
      - android14-lineage21-mod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 检出当前仓库代码
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          repository: liyafe1997/kernel_xiaomi_sm8250_mod
          ref: android14-lineage21-mod

      # 设置基础环境
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache

      # 下载并解压 Proton Clang 工具链
      - name: Download and setup Proton Clang
        run: |
          mkdir -p /root/proton-clang
          cd /root/proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          mv proton-clang-20210522 proton-clang-20210522-bin
          echo "Proton Clang toolchain downloaded and extracted."

      # 克隆项目到指定目录
      - name: Clone kernel source
        run: |
          mkdir -p /root/kernel_xiaomi_sm8250_mod
          cp -r ./* /root/kernel_xiaomi_sm8250_mod/
          echo "Kernel source copied to /root/kernel_xiaomi_sm8250_mod."

      # 运行 build.sh 脚本
      - name: Build kernel
        working-directory: /root/kernel_xiaomi_sm8250_mod
        run: |
          chmod +x build.sh
          bash build.sh lmi ksu
          echo "Kernel build completed."

      # 上传编译结果
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output
          path: /root/kernel_xiaomi_sm8250_mod/out
