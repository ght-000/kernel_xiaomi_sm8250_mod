name: Kernel Build
on:
  push:
    branches: [ "android14-lineage21-mod" ]
  pull_request:
    branches: [ "android14-lineage21-mod" ]
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [
          alioth, apollo, lmi, thyme, umi, pipa,
          psyche, munch, cmi, cas, elish, enuma, dagu
        ]
        ksu: ["", "ksu"]
        exclude:
          - device: pipa
            ksu: "ksu"
    name: Build ${{ matrix.device }} ${{ matrix.ksu && 'with KSU' || 'No KSU' }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget \
          bison flex zip bc cpio libssl-dev ccache python-is-python3
    - name: Setup Proton Clang
      run: |
        mkdir -p $HOME/proton-clang
        wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip -O proton.zip
        unzip proton.zip -d $HOME/proton-clang/
        echo "PROTON_CLANG=$HOME/proton-clang/proton-clang-20210522" >> $GITHUB_ENV
    - name: Setup ccache
      uses: actions/cache@v3
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-${{ matrix.device }}-${{ hashFiles('**/*.c') }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Build Kernel
      run: |
        export PATH="$PROTON_CLANG/bin:$PATH"
        export CCACHE_DIR=~/.cache/ccache_mikernel
        bash build.sh ${{ matrix.device }} ${{ matrix.ksu }}
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-${{ matrix.device }}-${{ matrix.ksu && 'ksu' || 'noksu' }}
        path: |
          out/*.zip
          out/*.img
