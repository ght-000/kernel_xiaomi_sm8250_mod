name: Build Android Kernel

on:
  push:
    branches:
      - android14-lineage21-mod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 检出工作流脚本所在的仓库（如果需要）
      - name: Checkout workflow repository
        uses: actions/checkout@v3

      # 设置编译环境
      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache

      # 下载 Proton Clang 工具链
      - name: Download Proton Clang toolchain
        run: |
          mkdir -p proton-clang
          cd proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          mv proton-clang-20210522/* .
          rm -rf proton-clang-20210522 20210522.zip

      # 克隆内核源码
      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch android14-lineage21-mod https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod.git kernel_xiaomi_sm8250_mod

      # 编译内核
      - name: Build kernel
        run: |
          export PATH=$(pwd)/proton-clang/bin:$PATH
          cd kernel_xiaomi_sm8250_mod
          bash build.sh lmi ksu

      # 上传编译结果
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4 # 使用最新版本 v4
        with:
          name: kernel-build-output
          path: kernel_xiaomi_sm8250_mod/out/
