name: Android Kernel Build
on:
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main ] # 按需替换你的分支名
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: 设置构建环境
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache
    - name: 准备工具链
      run: |
        mkdir proton-clang
        cd proton-clang
        wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
        unzip 20210522.zip
        mv proton-clang-20210522/* .
        cd ..
        echo "CLANG_PATH=$(pwd)/proton-clang/bin" >> $GITHUB_ENV
    - name: 检出内核源码
      uses: actions/checkout@v4
      with:
        repository: liyafe1997/kernel_xiaomi_sm8250_mod
        ref: android14-lineage21-mod
        path: kernel_src
    - name: 配置Git身份
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    - name: 配置CCache缓存
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-kernel
    - name: 执行编译
      working-directory: ./kernel_src
      env:
        PATH: ${{ env.CLANG_PATH }}:$PATH
        CCACHE_DIR: /home/runner/.ccache
      run: |
        export CC="clang"
        export CLANG_TRIPLE="aarch64-linux-gnu-"
        bash build.sh lmi ksu
