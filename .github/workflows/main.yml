name: Build Android Kernel
on:
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main ] # 根据您的仓库分支调整
jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120  # 根据编译时间调整
    steps:
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git curl wget \
          bison flex zip bc cpio \
          libssl-dev ccache
    - name: Setup Proton Clang
      run: |
        wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
        unzip 20210522.zip
        mv proton-clang-20210522 proton-clang
    - name: Clone Kernel Source
      run: |
        git clone https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod.git \
          --branch android14-lineage21-mod \
          --depth=1 \
          kernel_xiaomi_sm8250_mod
    - name: Build Kernel
      run: |
        cd kernel_xiaomi_sm8250_mod
        chmod +x build.sh
        bash build.sh lmi ksu
    # 可选：上传编译产物
    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          kernel_xiaomi_sm8250_mod/out/*.zip
          kernel_xiaomi_sm8250_mod/out/*.img
