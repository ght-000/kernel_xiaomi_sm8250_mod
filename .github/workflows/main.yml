name: Build Android Kernel
on:
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main ] # 根据你的仓库分支调整
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --privileged # 授予必要权限
    steps:
    - name: Set up environment
      run: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential git curl wget bison flex zip bc cpio libssl-dev ccache \
          python3 python-is-python3
        ln -s /usr/bin/ccache /usr/local/bin/gcc
        ln -s /usr/bin/ccache /usr/local/bin/g++
    - name: Prepare workspace
      run: mkdir -p ${GITHUB_WORKSPACE}/kernel_build
    - name: Install Proton Clang
      run: |
        cd ${GITHUB_WORKSPACE}
        wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
        unzip 20210522.zip -d proton-clang
        mv proton-clang/proton-clang-20210522 proton-clang/proton-clang
    - name: Clone kernel source
      run: |
        git clone https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod.git \
          --depth=1 \
          --branch=android14-lineage21-mod \
          ${GITHUB_WORKSPACE}/kernel_xiaomi_sm8250_mod
    - name: Build kernel
      run: |
        cd ${GITHUB_WORKSPACE}/kernel_xiaomi_sm8250_mod
        chmod +x build.sh
        CCACHE_DIR="${GITHUB_WORKSPACE}/ccache" \
        PATH="${GITHUB_WORKSPACE}/proton-clang/proton-clang/bin:${PATH}" \
        bash build.sh lmi ksu
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build
        path: |
          ${GITHUB_WORKSPACE}/kernel_xiaomi_sm8250_mod/out/*.zip
          ${GITHUB_WORKSPACE}/kernel_xiaomi_sm8250_mod/out/*.img
    - name: Upload ccache
      uses: actions/upload-artifact@v3
      if: ${{ always() }}
      with:
        name: ccache
        path: ${GITHUB_WORKSPACE}/ccache
